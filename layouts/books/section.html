{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  <div class="prose">{{ .Content }}</div>
</header>

<ol class="book-list">
  {{- /* One entry per book: its first edition stands for the others. */}}
  {{- range .Pages.ByWeight }}
  {{- if eq . (index (partial "editions.html" .) 0) }}
  <li>{{ partial "book-summary.html" . }}</li>
  {{- end }}
  {{- end }}
</ol>
{{ end }}
