# Your site's address. If the domain ever changes, change it here
# and in GitHub → Settings → Pages → Custom domain.
baseURL = "https://www.pandapustories.com/"

title = "Panda Pu"
locale = "en-GB"

# Keep the site small: no tag pages or RSS feed for now.
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

[params]
  # Default description for search engines and link previews.
  description = "Panda Pu is a series of gentle stories for young children about curiosity, friendship, learning and discovering the world."

# Recommended by Hugo for GitHub Pages builds.
[caches.images]
  dir = ":cacheDir/images"
